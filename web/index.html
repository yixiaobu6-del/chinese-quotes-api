<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中文金句库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold mb-2">中文金句库</h1>
      <p class="text-gray-500">名言警句·经典语录·灵感源泉</p>
    </div>

    <!-- Tab切换 -->
    <div class="flex gap-2 mb-4">
      <button onclick="switchTab('main')" id="tabMain" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        <i class="fa fa-quote-left"></i> 金句
      </button>
      <button onclick="switchTab('favorites')" id="tabFav" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
        <i class="fa fa-heart"></i> 收藏 (<span id="favCount">0</span>)
      </button>
      <button onclick="switchTab('scene')" id="tabScene" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
        <i class="fa fa-tags"></i> 场景匹配
      </button>
      <button onclick="switchTab('card')" id="tabCard" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
        <i class="fa fa-picture-o"></i> 卡片生成
      </button>
    </div>

    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <div class="flex gap-2 mb-4">
        <button onclick="randomQuote()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
          <i class="fa fa-random"></i> 随机一句
        </button>
        <button onclick="copyQuote()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
          <i class="fa fa-copy"></i> 复制
        </button>
        <button onclick="toggleFavorite()" id="favBtn" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500">
          <i class="fa fa-heart"></i> 收藏
        </button>
        <button onclick="readQuote()" id="readBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
          <i class="fa fa-volume-up"></i> 朗读
        </button>
        <button onclick="toggleMode()" id="modeBtn" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
          <i class="fa fa-list"></i> 浏览模式
        </button>
      </div>

      <!-- 收藏列表 -->
      <div id="favoritesTab" class="hidden">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-sm"><i class="fa fa-heart text-red-500"></i> 我的收藏</h3>
          <button onclick="clearFavorites()" class="text-red-400 hover:text-red-600 text-xs"><i class="fa fa-trash"></i> 清空</button>
        </div>
        <div id="favoritesList" class="space-y-2 max-h-[300px] overflow-y-auto"></div>
      </div>

      <!-- 场景匹配 -->
      <div id="sceneTab" class="hidden">
        <div class="mb-4">
          <label class="block text-sm font-medium mb-2">描述你的使用场景：</label>
          <div class="flex gap-2">
            <input type="text" id="sceneInput" class="flex-1 border rounded px-3 py-2" placeholder="例如：毕业致辞、辞职信、道歉、表白、年会演讲..." oninput="sceneMatch()">
            <button onclick="sceneMatch()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600"><i class="fa fa-search"></i> 匹配</button>
          </div>
          <div class="flex gap-1 flex-wrap mt-2">
            <button onclick="quickScene('毕业致辞')" class="px-2 py-1 bg-purple-100 rounded text-xs hover:bg-purple-200">毕业致辞</button>
            <button onclick="quickScene('表白')" class="px-2 py-1 bg-pink-100 rounded text-xs hover:bg-pink-200">表白</button>
            <button onclick="quickScene('道歉')" class="px-2 py-1 bg-red-100 rounded text-xs hover:bg-red-200">道歉</button>
            <button onclick="quickScene('年会演讲')" class="px-2 py-1 bg-blue-100 rounded text-xs hover:bg-blue-200">年会演讲</button>
            <button onclick="quickScene('辞职信')" class="px-2 py-1 bg-yellow-100 rounded text-xs hover:bg-yellow-200">辞职信</button>
            <button onclick="quickScene('安慰朋友')" class="px-2 py-1 bg-green-100 rounded text-xs hover:bg-green-200">安慰朋友</button>
            <button onclick="quickScene('朋友圈文案')" class="px-2 py-1 bg-indigo-100 rounded text-xs hover:bg-indigo-200">朋友圈文案</button>
            <button onclick="quickScene('职场励志')" class="px-2 py-1 bg-teal-100 rounded text-xs hover:bg-teal-200">职场励志</button>
          </div>
        </div>
        <div id="sceneResults" class="text-center text-gray-400 py-8">输入或选择场景，自动推荐匹配金句</div>
      </div>

      <!-- 卡片生成 -->
      <div id="cardTab" class="hidden">
        <div class="mb-4">
          <div class="flex gap-2 mb-2">
            <button onclick="pickCardQuote()" class="bg-gradient-to-r from-pink-500 to-purple-500 text-white px-4 py-2 rounded hover:opacity-90">
              <i class="fa fa-random"></i> 随机选一句
            </button>
            <button onclick="downloadCard()" id="downloadCardBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
              <i class="fa fa-download"></i> 下载卡片
            </button>
          </div>
          <div class="flex gap-2 flex-wrap mb-2">
            <span class="text-xs text-gray-400 self-center">背景风格：</span>
            <button onclick="setCardBg(1)" id="cardBg1" class="w-8 h-8 rounded-full border-2 border-pink-300" style="background:linear-gradient(135deg,#667eea,#764ba2)"></button>
            <button onclick="setCardBg(2)" id="cardBg2" class="w-8 h-8 rounded-full border-2 border-transparent" style="background:linear-gradient(135deg,#f093fb,#f5576c)"></button>
            <button onclick="setCardBg(3)" id="cardBg3" class="w-8 h-8 rounded-full border-2 border-transparent" style="background:linear-gradient(135deg,#4facfe,#00f2fe)"></button>
            <button onclick="setCardBg(4)" id="cardBg4" class="w-8 h-8 rounded-full border-2 border-transparent" style="background:linear-gradient(135deg,#43e97b,#38f9d7)"></button>
            <button onclick="setCardBg(5)" id="cardBg5" class="w-8 h-8 rounded-full border-2 border-transparent" style="background:linear-gradient(135deg,#fa709a,#fee140)"></button>
            <button onclick="setCardBg(6)" id="cardBg6" class="w-8 h-8 rounded-full border-2 border-transparent" style="background:linear-gradient(135deg,#a18cd1,#fbc2eb)"></button>
            <button onclick="setCardBg(7)" id="cardBg7" class="w-8 h-8 rounded-full border-2 border-transparent" style="background:linear-gradient(135deg,#fccb90,#d57eeb)"></button>
            <button onclick="setCardBg(8)" id="cardBg8" class="w-8 h-8 rounded-full border-2 border-transparent" style="background:linear-gradient(135deg,#89f7fe,#66a6ff)"></button>
          </div>
        </div>
        <div id="cardPreview" class="relative rounded-xl overflow-hidden shadow-lg mx-auto" style="max-width:420px;height:520px;">
          <canvas id="cardCanvas" width="420" height="520" class="w-full h-full"></canvas>
          <div id="cardPlaceholder" class="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-pink-400 to-purple-500 text-white text-lg">点击"随机选一句"开始制作</div>
        </div>
      </div>

      <!-- 随机模式 -->
      <div id="randomMode">
        <div id="quoteCard" class="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-lg p-8 text-center">
          <div id="quoteText" class="text-xl md:text-2xl text-gray-800 leading-relaxed mb-4">"点击"随机一句"获取金句</div>
          <div id="quoteAuthor" class="text-gray-500">——</div>
          <div id="quoteCategory" class="inline-block mt-4 px-3 py-1 bg-blue-100 text-blue-600 rounded text-sm"></div>
        </div>
      </div>

      <!-- 浏览模式 -->
      <div id="browseMode" class="hidden">
        <div class="flex gap-2 mb-4">
          <input type="text" id="searchInput" class="flex-1 border rounded px-3 py-2" placeholder="搜索金句内容或作者...">
          <select id="categoryFilter" class="border rounded px-3 py-2">
            <option value="全部">全部分类</option>
          </select>
        </div>
        <div id="browseList" class="space-y-2 max-h-96 overflow-y-auto"></div>
        <div class="text-center text-sm text-gray-400 mt-2">
          共 <span id="resultCount">0</span> 条
        </div>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow p-6">
      <div class="flex gap-2 mb-4">
        <button onclick="showCategory('鼓励')" class="px-3 py-1 bg-yellow-100 rounded text-sm hover:bg-yellow-200">鼓励</button>
        <button onclick="showCategory('哲理')" class="px-3 py-1 bg-blue-100 rounded text-sm hover:bg-blue-200">哲理</button>
        <button onclick="showCategory('爱情')" class="px-3 py-1 bg-pink-100 rounded text-sm hover:bg-pink-200">爱情</button>
        <button onclick="showCategory('奋斗')" class="px-3 py-1 bg-green-100 rounded text-sm hover:bg-green-200">奋斗</button>
        <button onclick="showCategory('古诗词')" class="px-3 py-1 bg-purple-100 rounded text-sm hover:bg-purple-200">古诗词</button>
        <button onclick="showCategory('名人')" class="px-3 py-1 bg-red-100 rounded text-sm hover:bg-red-200">名人</button>
        <button onclick="showCategory('读书')" class="px-3 py-1 bg-indigo-100 rounded text-sm hover:bg-indigo-200">读书</button>
        <button onclick="showCategory('成长')" class="px-3 py-1 bg-teal-100 rounded text-sm hover:bg-teal-200">成长</button>
        <button onclick="showCategory('管理')" class="px-3 py-1 bg-orange-100 rounded text-sm hover:bg-orange-200">管理</button>
        <button onclick="showCategory('团队')" class="px-3 py-1 bg-cyan-100 rounded text-sm hover:bg-cyan-200">团队</button>
        <button onclick="showCategory('创新')" class="px-3 py-1 bg-emerald-100 rounded text-sm hover:bg-emerald-200">创新</button>
      </div>
      <div id="categoryResult" class="text-gray-500 text-center py-4">点击分类快速筛选</div>
    </div>

    <div class="text-center text-xs text-gray-400 mt-4">
      <p>数据来源：中文金句库API | 收录经典语录</p>
      <p class="mt-1">
        <a href="#" onclick="tryApi();return false;" class="text-blue-500 hover:underline">连接后端API</a>
        <span class="mx-2">|</span>
        <a href="#" onclick="tryStandalone();return false;" class="text-blue-500 hover:underline">使用内置数据</a>
      </p>
    </div>
  </div>

  <script>
    let quotes = [];
    let mode = 'random';
    let currentQuote = null;

    // 内置数据（前端演示用）
    const builtIn = [
      { text: '天行健，君子以自强不息', author: '《周易》', category: '古诗词', source: '《周易·乾卦》', scenes: ['励志','年会演讲','毕业致辞'] },
      { text: '路漫漫其修远兮，吾将上下而求索', author: '屈原', category: '古诗词', source: '《离骚》', scenes: ['励志','学术研究','追求理想'] },
      { text: '长风破浪会有时，直挂云帆济沧海', author: '李白', category: '古诗词', source: '《行路难》', scenes: ['励志','创业','毕业致辞','职场励志'] },
      { text: '天生我材必有用，千金散尽还复来', author: '李白', category: '古诗词', source: '《将进酒》', scenes: ['励志','自信','职场励志'] },
      { text: '沉舟侧畔千帆过，病树前头万木春', author: '刘禹锡', category: '古诗词', source: '《酬乐天扬州初逢席上见赠》', scenes: ['励志','安慰','人生感悟'] },
      { text: '山重水复疑无路，柳暗花明又一村', author: '陆游', category: '古诗词', source: '《游山西村》', scenes: ['励志','安慰','人生感悟'] },
      { text: '不畏浮云遮望眼，自缘身在最高层', author: '王安石', category: '古诗词', source: '《登飞来峰》', scenes: ['励志','职场励志','格局'] },
      { text: '人生自古谁无死，留取丹心照汗青', author: '文天祥', category: '古诗词', source: '《过零丁洋》', scenes: ['励志','爱国','毕业致辞'] },
      { text: '业精于勤，荒于嬉；行成于思，毁于随', author: '韩愈', category: '古诗词', source: '《进学解》', scenes: ['励志','职场励志','学习'] },
      { text: '纸上得来终觉浅，绝知此事要躬行', author: '陆游', category: '古诗词', source: '《冬夜读书示子聿》', scenes: ['学习','职场励志','实践'] },
      { text: '存在的就是合理的', author: '黑格尔', category: '哲理', source: '《法哲学原理》', scenes: ['思考','辩论'] },
      { text: '我思故我在', author: '笛卡尔', category: '哲理', source: '《方法论》', scenes: ['思考','哲学讨论'] },
      { text: '存在先于本质', author: '萨特', category: '哲理', source: '《存在与虚无》', scenes: ['思考','哲学讨论'] },
      { text: '人是会思考的芦苇', author: '帕斯卡', category: '哲理', source: '《思想录》', scenes: ['思考','人生感悟'] },
      { text: '他人即地狱', author: '萨特', category: '哲理', source: '《禁闭》', scenes: ['思考','人际关系'] },
      { text: '知识就是力量', author: '培根', category: '名人', source: '《沉思录》', scenes: ['学习','励志','职场励志'] },
      { text: '不要问国家能为你做什么，而要问你能为国家做什么', author: '肯尼迪', category: '名人', source: '1961年就职演说', scenes: ['爱国','毕业致辞','励志'] },
      { text: '我有一个梦想', author: '马丁·路德·金', category: '名人', source: '《我有一个梦想》演讲', scenes: ['励志','平等','理想'] },
      { text: '唯一值得我们恐惧的是恐惧本身', author: '罗斯福', category: '名人', source: '1933年就职演说', scenes: ['励志','安慰','克服困难'] },
      { text: '成功是1%的天分加上99%的汗水', author: '爱迪生', category: '名人', source: '受访时所言', scenes: ['励志','职场励志','学习'] },
      { text: '生活就像一盒巧克力，你永远不知道下一颗是什么味道', author: '《阿甘正传》', category: '电影', source: '电影《阿甘正传》', scenes: ['人生感悟','朋友圈文案'] },
      { text: '能力越大，责任越大', author: '《蜘蛛侠》', category: '电影', source: '电影《蜘蛛侠》', scenes: ['职场励志','人生感悟'] },
      { text: '要么忙着活，要么忙着死', author: '《肖申克的救赎》', category: '电影', source: '电影《肖申克的救赎》', scenes: ['励志','人生感悟','职场励志'] },
      { text: '人生就像一盒巧克力，你永远不知道下一颗是什么味道', author: '《阿甘正传》', category: '电影', source: '电影《阿甘正传》', scenes: ['人生感悟','朋友圈文案'] },
      { text: '有信心不一定会成功，没信心一定不会成功', author: '《英雄本色》', category: '电影', source: '电影《英雄本色》', scenes: ['励志','自信'] },
      { text: '我们都在阴沟里，但仍有人仰望星空', author: '王尔德', category: '鼓励', source: '《温德米尔夫人的扇子》', scenes: ['励志','安慰','朋友圈文案'] },
      { text: '世界上只有一种真正的英雄主义，那就是认清生活的真相后依然热爱生活', author: '罗曼·罗兰', category: '鼓励', source: '《米开朗琪罗传》', scenes: ['励志','人生感悟','安慰'] },
      { text: '种一棵树最好的时间是十年前，其次是现在', author: '非洲谚语', category: '鼓励', source: '非洲谚语', scenes: ['励志','行动','职场励志'] },
      { text: '当你真心渴望某样东西时，整个宇宙都会来帮忙', author: '《牧羊少年奇幻之旅》', category: '鼓励', source: '《牧羊少年奇幻之旅》', scenes: ['励志','梦想'] },
      { text: '坚持下去，不是因为看到希望才坚持，而是坚持了才看到希望', author: '网络', category: '鼓励', source: '网络金句', scenes: ['励志','安慰','职场励志'] },
      { text: '给岁月以文明，而不是给文明以岁月', author: '刘慈欣', category: '科幻', source: '《三体》', scenes: ['思考','人生感悟'] },
      { text: '弱小和无知不是生存的障碍，傲慢才是', author: '刘慈欣', category: '科幻', source: '《三体》', scenes: ['思考','警示','职场励志'] },
      { text: '宇宙就是一座黑暗森林', author: '刘慈欣', category: '科幻', source: '《三体》', scenes: ['思考','科幻讨论'] },
      { text: '未来已来，只是分布不均', author: '威廉·吉布森', category: '科幻', source: '《经济学人》专访', scenes: ['思考','科技讨论'] },
      { text: '任何足够先进的技术，都与魔法无异', author: '克拉克', category: '科幻', source: '《未来的轮廓》', scenes: ['思考','科技讨论'] },
      { text: '世界上有两件东西能够深深地震撼人们的心灵，一件是我们心中崇高的道德准则，另一件是我们头顶上灿烂的星空', author: '康德', category: '哲理', source: '《实践理性批判》', scenes: ['思考','人生感悟'] },
      { text: '自由不是做你想做的事，而是不做你不想做的事', author: '卢梭', category: '哲理', source: '《社会契约论》', scenes: ['思考','人生感悟'] },
      { text: '人生而自由，却无往不在枷锁之中', author: '卢梭', category: '哲理', source: '《社会契约论》', scenes: ['思考','人生感悟'] },
      { text: '未经审视的人生不值得过', author: '苏格拉底', category: '哲理', source: '《申辩篇》', scenes: ['思考','人生感悟'] },
      { text: '认识你自己', author: '苏格拉底', category: '哲理', source: '德尔斐神庙铭文', scenes: ['思考','自我认知'] },
      { text: '一个人可以被毁灭，但不能被打败', author: '海明威', category: '鼓励', source: '《老人与海》', scenes: ['励志','安慰','人生感悟'] },
      { text: '生活总是让我们遍体鳞伤，但到后来，那些受伤的地方会变成我们最强壮的地方', author: '海明威', category: '鼓励', source: '《永别了，武器》', scenes: ['励志','安慰','人生感悟'] },
      { text: '其实地上本没有路，走的人多了，也便成了路', author: '鲁迅', category: '古诗词', source: '《故乡》', scenes: ['励志','创业','行动'] },
      { text: '横眉冷对千夫指，俯首甘为孺子牛', author: '鲁迅', category: '古诗词', source: '《自嘲》', scenes: ['励志','品格'] },
      { text: '愿中国青年都摆脱冷气，只是向上走', author: '鲁迅', category: '古诗词', source: '《热风》', scenes: ['励志','爱国','毕业致辞'] },
      { text: '曾经沧海难为水，除却巫山不是云', author: '元稹', category: '爱情', source: '《离思》', scenes: ['表白','爱情','思念'] },
      { text: '两情若是久长时，又岂在朝朝暮暮', author: '秦观', category: '爱情', source: '《鹊桥仙》', scenes: ['表白','爱情','异地恋'] },
      { text: '此情可待成追忆，只是当时已惘然', author: '李商隐', category: '爱情', source: '《锦瑟》', scenes: ['思念','回忆','感悟'] },
      { text: '众里寻他千百度，蓦然回首，那人却在灯火阑珊处', author: '辛弃疾', category: '爱情', source: '《青玉案·元夕》', scenes: ['爱情','人生感悟','缘分'] },
      { text: '衣带渐宽终不悔，为伊消得人憔悴', author: '柳永', category: '爱情', source: '《蝶恋花》', scenes: ['爱情','坚持','表白'] },
      { text: '不想当将军的士兵不是好士兵', author: '拿破仑', category: '奋斗', source: '拿破仑语录', scenes: ['励志','职场励志','奋斗'] },
      { text: '天才是1%的灵感加上99%的汗水', author: '爱迪生', category: '奋斗', source: '受访时所言', scenes: ['励志','学习','职场励志'] },
      { text: '创新就是建立一种新的生产函数', author: '熊彼特', category: '商业', source: '《经济发展理论》', scenes: ['创业','商业讨论'] },
      { text: '企业的本质是创造顾客', author: '德鲁克', category: '商业', source: '《管理的实践》', scenes: ['商业讨论','创业'] },
      { text: '做正确的事，比正确地做事更重要', author: '德鲁克', category: '商业', source: '《有效管理者》', scenes: ['职场励志','管理','决策'] },
      { text: '专注是成功的秘诀', author: '巴菲特', category: '商业', source: '巴菲特致股东信', scenes: ['职场励志','投资','学习'] },
      { text: '在别人贪婪时恐惧，在别人恐惧时贪婪', author: '巴菲特', category: '商业', source: '巴菲特名言', scenes: ['投资','商业讨论','决策'] },
      { text: '活着本身就是意义', author: '余华', category: '人生', source: '《活着》', scenes: ['人生感悟','安慰'] },
      { text: '生活是属于每个人自己的感受，不属于任何别人的看法', author: '余华', category: '人生', source: '《活着》', scenes: ['人生感悟','朋友圈文案'] },
      { text: '人生最大的遗憾，是一个人无法同时拥有青春和对青春的感受', author: '海明威', category: '人生', source: '海明威语录', scenes: ['人生感悟','回忆'] },
      { text: '所谓无底深渊，下去，也是前程万里', author: '木心', category: '鼓励', source: '《素履之往》', scenes: ['励志','安慰','人生感悟'] },
      { text: '生活的最佳状态是冷冷清清的风风火火', author: '木心', category: '人生', source: '《云雀叫了一整天》', scenes: ['人生感悟','朋友圈文案'] },
      { text: '从前的日色变得慢，车、马、邮件都慢，一生只够爱一个人', author: '木心', category: '爱情', source: '《从前慢》', scenes: ['爱情','思念','朋友圈文案'] },
      { text: '人的一切痛苦，本质上都是对自己无能的愤怒', author: '王小波', category: '哲理', source: '《沉默的大多数》', scenes: ['思考','人生感悟'] },
      { text: '你想成为什么样的人，你就会成为什么样的人', author: '王小波', category: '鼓励', source: '王小波语录', scenes: ['励志','自信','毕业致辞'] },
      { text: '一辈子很短，如白驹过隙，转瞬即逝。可这种心情很长，如高山大川，连绵不绝', author: '《武林外传》', category: '爱情', source: '电视剧《武林外传》', scenes: ['爱情','人生感悟','朋友圈文案'] },
      { text: '花无重开日，人无再少年', author: '关汉卿', category: '人生', source: '《窦娥冤》', scenes: ['人生感悟','惜时'] },
      { text: '海内存知己，天涯若比邻', author: '王勃', category: '友情', source: '《送杜少府之任蜀州》', scenes: ['友情','送别','安慰'] },
      { text: '莫愁前路无知己，天下谁人不识君', author: '高适', category: '友情', source: '《别董大》', scenes: ['友情','送别','励志'] },
      { text: '同是天涯沦落人，相逢何必曾相识', author: '白居易', category: '友情', source: '《琵琶行》', scenes: ['友情','安慰','人生感悟'] },
      { text: '行到水穷处，坐看云起时', author: '王维', category: '人生', source: '《终南别业》', scenes: ['人生感悟','豁达','朋友圈文案'] },
      { text: '采菊东篱下，悠然见南山', author: '陶渊明', category: '人生', source: '《饮酒》', scenes: ['人生感悟','隐逸'] },
      { text: '非淡泊无以明志，非宁静无以致远', author: '诸葛亮', category: '人生', source: '《诫子书》', scenes: ['励志','人生感悟','品格'] },
      { text: '静以修身，俭以养德', author: '诸葛亮', category: '人生', source: '《诫子书》', scenes: ['人生感悟','品格'] },
      { text: '一寸光阴一寸金，寸金难买寸光阴', author: '《增广贤文》', category: '人生', source: '《增广贤文》', scenes: ['惜时','学习','励志'] },
      { text: '书山有路勤为径，学海无涯苦作舟', author: '韩愈', category: '奋斗', source: '《古今贤文》', scenes: ['学习','励志','职场励志'] },
      { text: '少壮不努力，老大徒伤悲', author: '《乐府诗集》', category: '奋斗', source: '《长歌行》', scenes: ['励志','惜时','学习'] },
      { text: '春蚕到死丝方尽，蜡炬成灰泪始干', author: '李商隐', category: '爱情', source: '《无题》', scenes: ['爱情','思念','奉献'] },
      { text: '愿得一心人，白头不相离', author: '卓文君', category: '爱情', source: '《白头吟》', scenes: ['爱情','表白','婚姻'] },
      { text: '问世间情为何物，直教人生死相许', author: '元好问', category: '爱情', source: '《摸鱼儿·雁丘词》', scenes: ['爱情','思念','表白'] },
      { text: '科学没有国界，但科学家有祖国', author: '巴斯德', category: '名人', source: '巴斯德语录', scenes: ['爱国','学术研究'] },
      { text: '为中华之崛起而读书', author: '周恩来', category: '名人', source: '周恩来少年名言', scenes: ['爱国','励志','学习'] },
      { text: '星星之火，可以燎原', author: '毛泽东', category: '名人', source: '《星星之火，可以燎原》', scenes: ['励志','创业','信念'] },
      { text: '实践是检验真理的唯一标准', author: '邓小平', category: '名人', source: '1978年真理标准大讨论', scenes: ['思考','职场励志','学术研究'] },
      { text: '时间就是金钱，效率就是生命', author: '深圳口号', category: '奋斗', source: '深圳蛇口标语', scenes: ['职场励志','创业'] },
      { text: '一个人的价值，应该看他贡献什么，而不应当看他取得什么', author: '爱因斯坦', category: '名人', source: '爱因斯坦语录', scenes: ['人生感悟','毕业致辞','职场励志'] },
      { text: '想象力比知识更重要', author: '爱因斯坦', category: '名人', source: '爱因斯坦语录', scenes: ['创新','学习','思考'] },
      { text: '不要试图成为一个成功的人，而要努力成为一个有价值的人', author: '爱因斯坦', category: '名人', source: '爱因斯坦语录', scenes: ['人生感悟','毕业致辞','职场励志'] },
      { text: '坚持就是胜利', author: '网络', category: '奋斗', source: '网络金句', scenes: ['励志','职场励志','安慰'] },
      { text: '宝剑锋从磨砺出，梅花香自苦寒来', author: '《警世贤文》', category: '奋斗', source: '《警世贤文》', scenes: ['励志','学习','职场励志'] },
      { text: '千磨万击还坚劲，任尔东西南北风', author: '郑板桥', category: '奋斗', source: '《竹石》', scenes: ['励志','品格','人生感悟'] },
      { text: '会当凌绝顶，一览众山小', author: '杜甫', category: '奋斗', source: '《望岳》', scenes: ['励志','毕业致辞','格局'] },
      { text: '读书破万卷，下笔如有神', author: '杜甫', category: '奋斗', source: '《奉赠韦左丞丈二十二韵》', scenes: ['学习','写作'] },
      { text: '三人行，必有我师焉', author: '孔子', category: '哲理', source: '《论语·述而》', scenes: ['学习','谦虚','职场励志'] },
      { text: '学而不思则罔，思而不学则殆', author: '孔子', category: '哲理', source: '《论语·为政》', scenes: ['学习','思考','学术研究'] },
      { text: '温故而知新，可以为师矣', author: '孔子', category: '哲理', source: '《论语·为政》', scenes: ['学习','教学'] },
      { text: '千里之行，始于足下', author: '老子', category: '哲理', source: '《道德经》', scenes: ['励志','行动','创业'] },
      { text: '道可道，非常道', author: '老子', category: '哲理', source: '《道德经》', scenes: ['思考','哲学讨论'] },
      { text: '上善若水，水善利万物而不争', author: '老子', category: '哲理', source: '《道德经》', scenes: ['品格','人生感悟'] },
      { text: '知之为知之，不知为不知，是知也', author: '孔子', category: '哲理', source: '《论语·为政》', scenes: ['学习','诚实','思考'] },
      { text: '己所不欲，勿施于人', author: '孔子', category: '哲理', source: '《论语·卫灵公》', scenes: ['处世','品格','人际关系'] },
      { text: '君子和而不同，小人同而不和', author: '孔子', category: '哲理', source: '《论语·子路》', scenes: ['处世','品格','管理'] },
      { text: '贪安稳就没有自由，要自由就要历些危险', author: '鲁迅', category: '人生', source: '《鲁迅全集》', scenes: ['励志','人生感悟','创业'] },
      { text: '人生的旅程就是这样，用大把时间迷茫，在几个瞬间成长', author: '网络', category: '人生', source: '网络金句', scenes: ['人生感悟','安慰','成长'] },
      { text: '也许每个人心中都有一个风筝，无论它意味着什么，让我们勇敢地去追', author: '《追风筝的人》', category: '鼓励', source: '《追风筝的人》', scenes: ['励志','勇气','人生感悟'] },
      { text: '所有的大人都曾经是小孩，虽然，只有少数的人记得', author: '《小王子》', category: '人生', source: '《小王子》', scenes: ['人生感悟','童心','朋友圈文案'] },
      { text: '只有用心灵才能看得清事物本质，真正重要的东西是肉眼无法看见的', author: '《小王子》', category: '人生', source: '《小王子》', scenes: ['人生感悟','爱情','思考'] },
      { text: '正因为你在你的玫瑰上花费了时间，这才使你的玫瑰变得如此重要', author: '《小王子》', category: '爱情', source: '《小王子》', scenes: ['爱情','付出','人生感悟'] },
      { text: '做人如果没有梦想，那和咸鱼有什么区别', author: '周星驰', category: '奋斗', source: '电影《少林足球》', scenes: ['励志','梦想','职场励志'] },
      { text: '我养你啊！', author: '周星驰', category: '爱情', source: '电影《喜剧之王》', scenes: ['表白','爱情'] },
      { text: '曾经有一份真诚的爱情放在我面前，我没有珍惜', author: '周星驰', category: '爱情', source: '电影《大话西游》', scenes: ['爱情','思念','道歉'] },
      { text: '有些鸟是不能关在笼子里的，它们的羽毛太光亮了', author: '《肖申克的救赎》', category: '鼓励', source: '电影《肖申克的救赎》', scenes: ['励志','自由','人生感悟'] },
      { text: '希望是个好东西，也许是世间最好的东西，好东西永远不会消逝', author: '《肖申克的救赎》', category: '鼓励', source: '电影《肖申克的救赎》', scenes: ['励志','安慰','人生感悟'] },
      { text: '以大多数人的努力程度之低，根本轮不到去拼天赋', author: '网络', category: '奋斗', source: '网络金句', scenes: ['励志','学习','职场励志'] },
      { text: '你的问题主要在于读书不多而想得太多', author: '杨绛', category: '人生', source: '《杨绛全集》', scenes: ['学习','人生感悟','思考'] },
      { text: '世间好物不坚牢，彩云易散琉璃脆', author: '杨绛', category: '人生', source: '《我们仨》', scenes: ['人生感悟','回忆','安慰'] },
      { text: '我们曾如此渴望命运的波澜，到最后才发现，人生最曼妙的风景，竟是内心的淡定与从容', author: '杨绛', category: '人生', source: '《一百岁感言》', scenes: ['人生感悟','豁达','朋友圈文案'] },
      { text: '世事洞明皆学问，人情练达即文章', author: '曹雪芹', category: '人生', source: '《红楼梦》', scenes: ['人生感悟','处世','学习'] },
      { text: '满纸荒唐言，一把辛酸泪', author: '曹雪芹', category: '人生', source: '《红楼梦》', scenes: ['人生感悟','创作'] },
      { text: '相见时难别亦难，东风无力百花残', author: '李商隐', category: '爱情', source: '《无题》', scenes: ['爱情','思念','离别'] },
      { text: '人生如逆旅，我亦是行人', author: '苏轼', category: '人生', source: '《临江仙·送钱穆父》', scenes: ['人生感悟','豁达','朋友圈文案'] },
      { text: '竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生', author: '苏轼', category: '鼓励', source: '《定风波》', scenes: ['励志','豁达','人生感悟'] },
      { text: '人间有味是清欢', author: '苏轼', category: '人生', source: '《浣溪沙》', scenes: ['人生感悟','生活','朋友圈文案'] },
      { text: '十年生死两茫茫，不思量，自难忘', author: '苏轼', category: '爱情', source: '《江城子·乙卯正月二十日夜记梦》', scenes: ['爱情','思念','回忆'] },
      { text: '人生如戏，全靠演技', author: '网络', category: '人生', source: '网络金句', scenes: ['人生感悟','幽默'] },
      { text: '你以为你以为的就是你以为的吗', author: '网络', category: '哲理', source: '网络金句', scenes: ['思考','幽默','辩论'] },
      { text: '好看的皮囊千篇一律，有趣的灵魂万里挑一', author: '网络', category: '人生', source: '网络金句', scenes: ['人生感悟','交友','朋友圈文案'] },
      { text: '世界那么大，我想去看看', author: '网络', category: '人生', source: '网络金句', scenes: ['旅行','人生感悟','辞职'] },
      { text: '没有什么是一顿火锅解决不了的，如果有，那就两顿', author: '网络', category: '人生', source: '网络金句', scenes: ['幽默','安慰','生活'] },
      { text: '失败是成功之母，可惜成功六亲不认', author: '网络', category: '奋斗', source: '网络金句', scenes: ['幽默','励志','职场励志'] },
      { text: '努力不一定会成功，但不努力一定会很舒服', author: '网络', category: '奋斗', source: '网络金句', scenes: ['幽默','励志'] },
      { text: '把每一天都当作生命中的最后一天，你一定会找到人生的方向', author: '乔布斯', category: '奋斗', source: '2005年斯坦福毕业演讲', scenes: ['励志','毕业致辞','人生感悟'] },
      { text: 'Stay hungry, stay foolish', author: '乔布斯', category: '奋斗', source: '2005年斯坦福毕业演讲', scenes: ['励志','毕业致辞','创新'] },
      { text: '设计不只是它看起来怎样，还在于它怎样工作', author: '乔布斯', category: '商业', source: '乔布斯语录', scenes: ['设计','创新','产品'] },
      { text: '唯一的限制是你自己设下的限制', author: '拿破仑·希尔', category: '鼓励', source: '《思考致富》', scenes: ['励志','自信','职场励志'] },
      // === 读书类 ===
      { text: '读书破万卷，下笔如有神', author: '杜甫', category: '读书', source: '《奉赠韦左丞丈二十二韵》', scenes: ['学习','写作'] },
      { text: '书是人类进步的阶梯', author: '高尔基', category: '读书', source: '高尔基语录', scenes: ['学习','励志'] },
      { text: '读一本好书，就是和许多高尚的人谈话', author: '笛卡尔', category: '读书', source: '笛卡尔语录', scenes: ['学习','思考'] },
      { text: '书籍是造就灵魂的工具', author: '雨果', category: '读书', source: '雨果语录', scenes: ['学习','人生感悟'] },
      { text: '读书不是为了雄辩和驳斥，也不是为了轻信和盲从，而是为了思考和权衡', author: '培根', category: '读书', source: '《培根随笔》', scenes: ['学习','思考','学术研究'] },
      { text: '读书使人充实，思考使人深邃，交谈使人清醒', author: '富兰克林', category: '读书', source: '富兰克林语录', scenes: ['学习','思考','交流'] },
      { text: '不读书的人，思想就会停止', author: '狄德罗', category: '读书' },
      { text: '读书有三到：心到、眼到、口到', author: '朱熹', category: '读书' },
      { text: '书到用时方恨少，事非经过不知难', author: '陆游', category: '读书' },
      { text: '问渠那得清如许，为有源头活水来', author: '朱熹', category: '读书' },
      { text: '立身以立学为先，立学以读书为本', author: '欧阳修', category: '读书' },
      { text: '腹有诗书气自华，读书万卷始通神', author: '苏轼', category: '读书' },
      { text: '知之者不如好之者，好之者不如乐之者', author: '孔子', category: '读书' },
      { text: '学而不已，阖棺乃止', author: '孔子', category: '读书' },
      { text: '吾生也有涯，而知也无涯', author: '庄子', category: '读书' },
      { text: '读书是学习，使用也是学习，而且是更重要的学习', author: '毛泽东', category: '读书' },
      { text: '一个爱书的人，他必定不致于缺少一个忠实的朋友', author: '莎士比亚', category: '读书' },
      { text: '生活里没有书籍，就好像没有阳光', author: '莎士比亚', category: '读书' },
      { text: '阅读的最大理由是想摆脱平庸', author: '余秋雨', category: '读书' },
      { text: '书卷多情似故人，晨昏忧乐每相亲', author: '于谦', category: '读书' },
      { text: '一日不读书，胸臆无佳想', author: '萧抡', category: '读书' },
      { text: '读书之法，在循序而渐进，熟读而精思', author: '朱熹', category: '读书' },
      { text: '旧书不厌百回读，熟读深思子自知', author: '苏轼', category: '读书' },
      { text: '奇文共欣赏，疑义相与析', author: '陶渊明', category: '读书' },
      { text: '发奋识遍天下字，立志读尽人间书', author: '苏轼', category: '读书' },
      { text: '索物于暗室者，莫良于火；索道于当世者，莫良于典', author: '徐干', category: '读书' },
      { text: '知识就是力量，而书籍是知识的源泉', author: '培根', category: '读书' },
      { text: '书中自有黄金屋，书中自有颜如玉', author: '赵恒', category: '读书' },
      { text: '养心莫若寡欲，至乐无如读书', author: '郑成功', category: '读书' },
      { text: '读书百遍，其义自见', author: '陈寿', category: '读书' },

      // === 成长类 ===
      { text: '成长就是妥协与坚持的两难', author: '东野圭吾', category: '成长' },
      { text: '成长是一笔交易，我们都是用朴素的童真与未经人事的洁白交换长大的勇气', author: '宫崎骏', category: '成长' },
      { text: '每一个优秀的人，都有一段沉默的时光', author: '网络', category: '成长' },
      { text: '所谓的成长，就是越来越能接受自己本来的样子', author: '几米', category: '成长' },
      { text: '一个人知道自己为什么而活，就可以忍受任何一种生活', author: '尼采', category: '成长' },
      { text: '凡是不能杀死我的，都会让我更强大', author: '尼采', category: '成长' },
      { text: '真正的高贵，不是优于别人，而是优于过去的自己', author: '海明威', category: '成长' },
      { text: '成长的道路上，我们终将学会与自己和解', author: '网络', category: '成长' },
      { text: '成熟不是心变老，而是眼泪在眼里打转却还能微笑', author: '网络', category: '成长' },
      { text: '每个人都有一段沉默的时光，那是扎根的日子', author: '网络', category: '成长' },
      { text: '与其互为人间，不如自成宇宙', author: '网络', category: '成长' },
      { text: '不要因为走得太远，忘了我们为什么出发', author: '纪伯伦', category: '成长' },
      { text: '人的一生就是进行尝试，尝试的越多，生活就越美好', author: '爱默生', category: '成长' },
      { text: '成长的过程，就是不断发现曾经的自己是傻子的过程', author: '网络', category: '成长' },
      { text: '当我们开始为自己而活，成长才真正开始', author: '网络', category: '成长' },
      { text: '你必须非常努力，才能看起来毫不费力', author: '网络', category: '成长' },
      { text: '没有谁的幸运是凭空而来的，只有当你足够努力，你才会足够幸运', author: '网络', category: '成长' },
      { text: '人生最精彩的不是实现梦想的瞬间，而是坚持梦想的过程', author: '韩寒', category: '成长' },
      { text: '与其仰望星空，不如脚踏实地', author: '网络', category: '成长' },
      { text: '没有人能替你承受痛苦，也没有人能拿走你的坚强', author: '网络', category: '成长' },
      { text: '世上有两种最耀眼的光芒，一种是太阳，一种是我们努力的模样', author: '网络', category: '成长' },
      { text: '成长就是不断告别，不断遇见', author: '网络', category: '成长' },
      { text: '真正的强者，不是没有眼泪的人，而是含着眼泪奔跑的人', author: '网络', category: '成长' },
      { text: '当你的才华还撑不起你的野心时，就应该静下心来学习', author: '网络', category: '成长' },
      { text: '做自己的太阳，无需凭借谁的光', author: '网络', category: '成长' },
      { text: '生活不是等待风暴过去，而是学会在雨中翩翩起舞', author: '网络', category: '成长' },
      { text: '成长是一种蜕变，失去了旧的，必然因为又来了新的', author: '三毛', category: '成长' },
      { text: '一个人至少拥有一个梦想，有一个理由去坚强', author: '三毛', category: '成长' },
      { text: '成熟的人不问过去，聪明的人不问现在，豁达的人不问未来', author: '刘墉', category: '成长' },
      { text: '人生没有白走的路，每一步都算数', author: '李宗盛', category: '成长' },
      { text: '你若盛开，清风自来', author: '网络', category: '成长' },
      { text: '岁月不饶人，我亦未曾饶过岁月', author: '木心', category: '成长' },
      { text: '所有的坚强都是温柔生的茧', author: '网络', category: '成长' },
      { text: '人在最低谷的时，每一步都是向上', author: '网络', category: '成长' },
      { text: '自我改变是一件十分艰难但又令人上瘾的事情', author: '网络', category: '成长' },
      { text: '你的职责是平整土地，而非焦虑时光', author: '网络', category: '成长' },

    async function loadQuotes() {
      try {
        const res = await fetch('http://localhost:8000/quotes');
        if (res.ok) {
          quotes = await res.json();
          return;
        }
      } catch (e) {}
      quotes = builtIn;
      // 为没有source/scenes的条目添加默认值
      quotes = quotes.map(q => {
        if (!q.source) q.source = q.author;
        if (!q.scenes) {
          // 根据category添加默认场景
          const sceneMap = {
            '鼓励': ['励志','安慰','职场励志'],
            '哲理': ['思考','人生感悟'],
            '爱情': ['表白','思念','爱情'],
            '奋斗': ['励志','职场励志','学习'],
            '古诗词': ['文学','人生感悟'],
            '名人': ['励志','人生感悟'],
            '读书': ['学习','读书','成长'],
            '成长': ['成长','励志','人生感悟'],
            '管理': ['职场励志','管理','领导力'],
            '团队': ['职场励志','团队合作','管理'],
            '创新': ['创业','创新','职场励志'],
            '人生': ['人生感悟','朋友圈文案'],
            '友情': ['友情','送别','安慰'],
            '科幻': ['思考','科幻讨论'],
            '电影': ['人生感悟','朋友圈文案'],
            '商业': ['创业','商业讨论','职场励志']
          };
          q.scenes = sceneMap[q.category] || ['通用'];
        }
        return q;
      });
    }

    function randomQuote() {
      if (quotes.length === 0) { quotes = builtIn; }
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      currentQuote = q;
      document.getElementById('quoteText').textContent = `"${q.text}"`;
      document.getElementById('quoteAuthor').textContent = `—— ${q.author}`;
      document.getElementById('quoteCategory').textContent = q.category || '未分类';
      updateFavButton(); // 更新收藏按钮状态
    }

    function copyQuote() {
      if (!currentQuote) { randomQuote(); }
      const text = `"${currentQuote.text}" —— ${currentQuote.author}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('已复制')).catch(() => fallbackCopyQuote(text));
      } else {
        fallbackCopyQuote(text);
      }
    }
    function fallbackCopyQuote(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      alert('已复制');
    }

    function toggleMode() {
      mode = mode === 'random' ? 'browse' : 'random';
      document.getElementById('randomMode').classList.toggle('hidden');
      document.getElementById('browseMode').classList.toggle('hidden');
      document.getElementById('modeBtn').innerHTML = mode === 'random'
        ? '<i class="fa fa-list"></i> 浏览模式'
        : '<i class="fa fa-random"></i> 随机模式';
      if (mode === 'browse') browseQuotes();
    }

    function browseQuotes() {
      const q = quotes.length > 0 ? quotes : builtIn;
      const search = document.getElementById('searchInput').value;
      const cat = document.getElementById('categoryFilter').value;
      const filtered = q.filter(item => {
        if (cat !== '全部' && item.category !== cat) return false;
        if (search && !item.text.includes(search) && !item.author.includes(search)) return false;
        return true;
      });

      document.getElementById('resultCount').textContent = filtered.length;
      const list = document.getElementById('browseList');
      list.innerHTML = filtered.map(item =>
        `<div class="p-3 bg-gray-50 rounded hover:bg-gray-100 cursor-pointer" onclick="selectBrowse(${JSON.stringify(item.text)}, ${JSON.stringify(item.author)})">
          <p>"${item.text.replace(/'/g, '&#39;')}"</p>
          <p class="text-sm text-gray-500">—— ${item.author.replace(/'/g, '&#39;')} <span class="text-xs text-blue-500">${item.category || ''}</span></p>
        </div>`
      ).join('');
    }

    function selectBrowse(text, author) {
      currentQuote = { text, author };
      document.getElementById('quoteText').textContent = `"${text}"`;
      document.getElementById('quoteAuthor').textContent = `—— ${author}`;
      updateFavButton(); // 更新收藏按钮状态
    }

    function showCategory(cat) {
      document.getElementById('categoryFilter').value = cat;
      document.getElementById('searchInput').value = '';
      if (mode !== 'browse') toggleMode();
      browseQuotes();
      const subset = (quotes.length > 0 ? quotes : builtIn).filter(q => q.category === cat);
      document.getElementById('categoryResult').innerHTML = subset.length > 0
        ? `<div class="text-left space-y-2">${subset.slice(0, 5).map(q => `<p>"${q.text}"<span class="text-gray-400"> —— ${q.author}</span></p>`).join('')}<p class="text-blue-500 mt-2">共 ${subset.length} 条，点击浏览模式查看全部</p></div>`
        : '暂无该分类金句';
    }

    function tryApi() {
      alert('请先确保后端API已启动：uvicorn api:app --reload --port 8000');
    }

    function tryStandalone() {
      quotes = builtIn;
      // 更新分类过滤
      const cats = [...new Set(quotes.map(q => q.category))];
      const sel = document.getElementById('categoryFilter');
      sel.innerHTML = '<option value="全部">全部分类</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
      randomQuote();
      alert('已切换为内置数据模式（' + quotes.length + '条金句）');
    }

    document.getElementById('searchInput').addEventListener('input', browseQuotes);
    document.getElementById('categoryFilter').addEventListener('change', browseQuotes);
    tryStandalone();
    randomQuote();

    // 尝试连接API
    loadQuotes().then(() => {
      if (quotes.length > builtIn.length) {
        tryStandalone();
      }
    });

    // === 收藏功能 ===
    const FAV_KEY = '金句库_favorites';
    let currentTab = 'main';

    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem(FAV_KEY)) || [];
      } catch(e) { return []; }
    }

    function saveFavorites(list) {
      localStorage.setItem(FAV_KEY, JSON.stringify(list));
      updateFavCount();
    }

    function updateFavCount() {
      document.getElementById('favCount').textContent = getFavorites().length;
    }

    function isFavorite(quote) {
      const favs = getFavorites();
      return favs.some(f => f.text === quote.text && f.author === quote.author);
    }

    function toggleFavorite() {
      if (!currentQuote) { randomQuote(); }
      let favs = getFavorites();
      const exists = favs.some(f => f.text === currentQuote.text && f.author === currentQuote.author);
      if (exists) {
        favs = favs.filter(f => f.text !== currentQuote.text || f.author !== currentQuote.author);
        document.getElementById('favBtn').innerHTML = '<i class="fa fa-heart"></i> 收藏';
        document.getElementById('favBtn').classList.remove('bg-red-500');
        document.getElementById('favBtn').classList.add('bg-gray-400');
      } else {
        favs.push(currentQuote);
        document.getElementById('favBtn').innerHTML = '<i class="fa fa-heart"></i> 已收藏';
        document.getElementById('favBtn').classList.remove('bg-gray-400');
        document.getElementById('favBtn').classList.add('bg-red-500');
      }
      saveFavorites(favs);
    }

    function updateFavButton() {
      if (currentQuote && isFavorite(currentQuote)) {
        document.getElementById('favBtn').innerHTML = '<i class="fa fa-heart"></i> 已收藏';
        document.getElementById('favBtn').classList.remove('bg-gray-400');
        document.getElementById('favBtn').classList.add('bg-red-500');
      } else {
        document.getElementById('favBtn').innerHTML = '<i class="fa fa-heart"></i> 收藏';
        document.getElementById('favBtn').classList.remove('bg-red-500');
        document.getElementById('favBtn').classList.add('bg-gray-400');
      }
    }

    function renderFavorites() {
      const favs = getFavorites();
      const list = document.getElementById('favoritesList');
      if (favs.length === 0) {
        list.innerHTML = '<div class="text-xs text-gray-400 text-center py-4">暂无收藏金句</div>';
        return;
      }
      list.innerHTML = favs.map((f, i) => `
        <div class="p-3 bg-gray-50 rounded hover:bg-gray-100">
          <p class="text-sm">"${f.text}"</p>
          <div class="flex justify-between items-center mt-2">
            <p class="text-xs text-gray-500">—— ${f.author} <span class="text-blue-500">${f.category || ''}</span></p>
            <div class="flex gap-2">
              <button onclick="readFavorite(${i})" class="text-green-500 hover:text-green-700"><i class="fa fa-volume-up"></i></button>
              <button onclick="removeFavorite(${i})" class="text-red-400 hover:text-red-600"><i class="fa fa-trash"></i></button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function removeFavorite(index) {
      let favs = getFavorites();
      favs.splice(index, 1);
      saveFavorites(favs);
      renderFavorites();
      updateFavButton();
    }

    function readFavorite(index) {
      const favs = getFavorites();
      const quote = favs[index];
      if (quote) {
        speakQuote(quote.text + '——' + quote.author);
      }
    }

    function clearFavorites() {
      if (confirm('确定清空所有收藏？')) {
        localStorage.removeItem(FAV_KEY);
        renderFavorites();
        updateFavCount();
        updateFavButton();
      }
    }

    // === Tab切换 ===
    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['main', 'favorites', 'scene', 'card'];
      const tabIds = ['tabMain', 'tabFav', 'tabScene', 'tabCard'];
      const contentIds = ['randomMode', 'favoritesTab', 'sceneTab', 'cardTab'];

      tabs.forEach((t, i) => {
        const btn = document.getElementById(tabIds[i]);
        const content = document.getElementById(contentIds[i]);
        if (t === tab) {
          btn.className = 'bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600';
          if (content) content.classList.remove('hidden');
        } else {
          btn.className = 'bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500';
          if (content) content.classList.add('hidden');
        }
      });
      if (tab === 'favorites') renderFavorites();
      if (tab === 'scene') sceneMatch();
    }

    // === 朗读功能（Web Speech API）===
    function speakQuote(text) {
      if ('speechSynthesis' in window) {
        // 先停止当前朗读
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.9;
        utterance.pitch = 1;

        // 尝试找到中文语音
        const voices = window.speechSynthesis.getVoices();
        const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN'));
        if (zhVoice) utterance.voice = zhVoice;

        window.speechSynthesis.speak(utterance);

        // 更新按钮状态
        document.getElementById('readBtn').innerHTML = '<i class="fa fa-volume-up"></i> 正在朗读...';
        utterance.onend = () => {
          document.getElementById('readBtn').innerHTML = '<i class="fa fa-volume-up"></i> 朗读';
        };
      } else {
        alert('您的浏览器不支持语音朗读功能');
      }
    }

    function readQuote() {
      if (!currentQuote) { randomQuote(); }
      const text = currentQuote.text + '——' + currentQuote.author;
      speakQuote(text);
    }

    // === 场景匹配功能 ===
    function getSceneKeywords(scene) {
      const sceneMap = {
        '毕业致辞': ['毕业','前程','梦想','未来','青春','奋斗','励志','告别'],
        '表白': ['爱情','喜欢','永远','相伴','承诺','真心','缘分','浪漫'],
        '道歉': ['原谅','错误','后悔','珍惜','弥补','惭愧','遗憾','真诚'],
        '年会演讲': ['奋斗','团队','梦想','创新','坚持','未来','收获','成长'],
        '辞职信': ['感恩','成长','追寻','梦想','感谢','祝福','前进','决定'],
        '安慰朋友': ['坚强','希望','勇气','陪伴','阳光','相信','温暖','美好'],
        '朋友圈文案': ['生活','人生','感悟','美好','时光','时光','温柔','有趣'],
        '职场励志': ['努力','奋斗','坚持','能力','成长','超越','价值','心态'],
        '励志': ['奋斗','坚持','梦想','努力','成功','信念','勇气','拼搏'],
        '思念': ['想念','距离','回忆','时光','深情','牵挂','期待','重逢'],
        '创新': ['创新','突破','变革','创造','勇气','不同','尝试','未来']
      };
      return sceneMap[scene] || scene.split('');
    }

    function sceneMatch() {
      if (!quotes.length) quotes = builtIn;
      const input = document.getElementById('sceneInput').value.trim();
      if (!input) {
        document.getElementById('sceneResults').innerHTML = '<div class="text-center text-gray-400 py-8">请输入场景关键词</div>';
        return;
      }
      const keywords = getSceneKeywords(input) || input.split(/\s+/);
      // 给每条金句打分：匹配场景标签得5分，匹配内容/作者的词得1分
      const scored = quotes.map(q => {
        let score = 0;
        // 场景标签匹配（权重高）
        if (q.scenes) {
          q.scenes.forEach(s => {
            if (input.includes(s) || s.includes(input)) score += 5;
            keywords.forEach(kw => { if (s.includes(kw) || kw.includes(s)) score += 3; });
          });
        }
        // 内容匹配
        keywords.forEach(kw => {
          if (q.text.includes(kw)) score += 1;
          if (q.author.includes(kw)) score += 1;
          if (q.category && q.category.includes(kw)) score += 1;
        });
        return { ...q, score };
      }).filter(q => q.score > 0).sort((a, b) => b.score - a.score).slice(0, 20);

      const container = document.getElementById('sceneResults');
      if (scored.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-8">未找到匹配场景的金句，试试其他关键词</div>';
        return;
      }
      container.innerHTML = `<div class="text-xs text-gray-400 mb-2">匹配到 ${scored.length} 条相关金句</div>
        ${scored.map((q, i) => `<div class="p-3 bg-purple-50 rounded-lg hover:bg-purple-100 cursor-pointer mb-2 ${i === 0 ? 'ring-2 ring-purple-300' : ''}" onclick="selectSceneQuote(${quotes.indexOf(q)})">
          <div class="flex items-start gap-2">
            <span class="text-purple-400 text-xs font-bold mt-0.5">#${i + 1}</span>
            <div class="flex-1">
              <p class="text-sm ${i === 0 ? 'font-bold' : ''}">"${q.text}"</p>
              <p class="text-xs text-gray-500 mt-1">—— ${q.author} <span class="text-purple-400">${q.source || ''}</span></p>
              ${q.scenes ? `<div class="flex gap-1 mt-1">${q.scenes.slice(0, 3).map(s => `<span class="text-xs px-1.5 py-0.5 bg-purple-100 text-purple-600 rounded">${s}</span>`).join('')}</div>` : ''}
              <div class="text-xs text-gray-400 mt-1">匹配度：${'★'.repeat(Math.min(5, Math.ceil(q.score / 3)))}${'☆'.repeat(Math.max(0, 5 - Math.ceil(q.score / 3)))}</div>
            </div>
          </div>
        </div>`).join('')}`;
    }

    function quickScene(scene) {
      document.getElementById('sceneInput').value = scene;
      if (currentTab !== 'scene') switchTab('scene');
      sceneMatch();
    }

    function selectSceneQuote(index) {
      const q = quotes[index];
      if (!q) return;
      currentQuote = q;
      document.getElementById('quoteText').textContent = `"${q.text}"`;
      document.getElementById('quoteAuthor').textContent = `—— ${q.author}`;
      document.getElementById('quoteCategory').textContent = q.category || '未分类';
      // 切换回主tab并显示出处
      switchTab('main');
      document.getElementById('quoteCard').innerHTML = `
        <div id="quoteText" class="text-xl md:text-2xl text-gray-800 leading-relaxed mb-4">"${q.text}"</div>
        <div id="quoteAuthor" class="text-gray-500">—— ${q.author}</div>
        <div id="quoteSource" class="text-xs text-amber-500 mt-2">📖 出处：${q.source || q.author}</div>
        <div id="quoteCategory" class="inline-block mt-4 px-3 py-1 bg-blue-100 text-blue-600 rounded text-sm">${q.category || ''}</div>
        ${q.scenes ? `<div class="flex gap-1 justify-center mt-2">${q.scenes.map(s => `<span class="text-xs px-1.5 py-0.5 bg-purple-100 text-purple-600 rounded">${s}</span>`).join('')}</div>` : ''}`;
      document.getElementById('favBtn').innerHTML = '<i class="fa fa-heart"></i> 收藏';
      document.getElementById('favBtn').classList.remove('bg-red-500');
      document.getElementById('favBtn').classList.add('bg-gray-400');
      updateFavButton();
    }

    // === 卡片生成功能 ===
    let cardBgIndex = 1;
    let cardQuoteData = null;

    function setCardBg(index) {
      cardBgIndex = index;
      // 更新选中状态
      for (let i = 1; i <= 8; i++) {
        const el = document.getElementById('cardBg' + i);
        if (el) el.className = 'w-8 h-8 rounded-full border-2 ' + (i === index ? 'border-pink-300' : 'border-transparent');
      }
      if (cardQuoteData) drawCard(cardQuoteData);
    }

    const cardBgs = {
      1: { grad: ['#667eea', '#764ba2'], textColor: '#ffffff', subColor: '#d4c5f0' },
      2: { grad: ['#f093fb', '#f5576c'], textColor: '#ffffff', subColor: '#fce4ec' },
      3: { grad: ['#4facfe', '#00f2fe'], textColor: '#ffffff', subColor: '#e0f7fa' },
      4: { grad: ['#43e97b', '#38f9d7'], textColor: '#1a5c3a', subColor: '#e8f5e9' },
      5: { grad: ['#fa709a', '#fee140'], textColor: '#5c3a1a', subColor: '#fff8e1' },
      6: { grad: ['#a18cd1', '#fbc2eb'], textColor: '#3a1a5c', subColor: '#f3e5f5' },
      7: { grad: ['#fccb90', '#d57eeb'], textColor: '#3a2a1a', subColor: '#fce4ec' },
      8: { grad: ['#89f7fe', '#66a6ff'], textColor: '#1a3a5c', subColor: '#e3f2fd' }
    };

    function pickCardQuote() {
      if (!quotes.length) quotes = builtIn;
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      cardQuoteData = q;
      drawCard(q);
    }

    function drawCard(q) {
      const canvas = document.getElementById('cardCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const bg = cardBgs[cardBgIndex] || cardBgs[1];

      // 清除
      ctx.clearRect(0, 0, w, h);

      // 绘制渐变背景
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, bg.grad[0]);
      grad.addColorStop(1, bg.grad[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // 装饰元素
      ctx.globalAlpha = 0.1;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * w, Math.random() * h, 30 + Math.random() * 60, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 引号
      ctx.font = 'bold 60px serif';
      ctx.fillStyle = bg.subColor;
      ctx.globalAlpha = 0.3;
      ctx.fillText('\u201C', 30, 70);
      ctx.globalAlpha = 1;

      // 金句正文
      const fontSize = q.text.length > 20 ? 22 : q.text.length > 12 ? 26 : 30;
      ctx.font = `bold ${fontSize}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif`;
      ctx.fillStyle = bg.textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 自动换行
      const maxWidth = w - 80;
      const lines = [];
      let line = '';
      for (let ch of q.text) {
        const testLine = line + ch;
        if (ctx.measureText(testLine).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else {
          line = testLine;
        }
      }
      if (line) lines.push(line);

      const lineHeight = fontSize * 1.5;
      const startY = (h - lines.length * lineHeight) / 2 - 20;
      lines.forEach((l, i) => {
        ctx.fillText(l, w / 2, startY + i * lineHeight);
      });

      // 分隔线
      const lineY = startY + lines.length * lineHeight + 20;
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(w / 2 - 40, lineY);
      ctx.lineTo(w / 2 + 40, lineY);
      ctx.strokeStyle = bg.subColor;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;

      // 作者
      ctx.font = '16px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
      ctx.fillStyle = bg.subColor;
      ctx.textAlign = 'center';
      ctx.fillText('—— ' + q.author, w / 2, lineY + 35);

      // 出处
      if (q.source) {
        ctx.font = '12px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = bg.subColor;
        ctx.fillText(q.source, w / 2, lineY + 58);
        ctx.globalAlpha = 1;
      }

      // 底部文字
      ctx.font = '11px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = bg.textColor;
      ctx.textAlign = 'center';
      ctx.fillText('中文金句库', w / 2, h - 20);
      ctx.globalAlpha = 1;

      document.getElementById('cardPlaceholder').classList.add('hidden');
    }

    function downloadCard() {
      const canvas = document.getElementById('cardCanvas');
      if (!cardQuoteData) {
        alert('请先生成一张卡片');
        return;
      }
      const link = document.createElement('a');
      link.download = `金句卡片_${cardQuoteData.author}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // 确保语音列表加载
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};
      // 有些浏览器需要触发一次才能加载语音列表
      window.speechSynthesis.getVoices();
    }

    // 初始化收藏数
    updateFavCount();
  </script>
</body>
</html>
